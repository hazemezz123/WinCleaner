[package]
name = "cleansweep"
version = "0.2.0"
edition = "2021"
description = "CleanSweep — modern lightweight disk-cleaning TUI for Windows"
authors = ["CleanSweep"]
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rayon = "1.10"
sysinfo = "0.33"
chrono = "0.4"
anyhow = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
